{% extends 'base.html' %}
{% block content %}
<h1>Пользователи</h1>
<ul>
  {% for u in users %}
    <li>
      <a href="{% url 'accounts:user_detail' u.pk %}">{{ u.username }}</a>
      {% if u.profile.avatar %}
        <img src="{{ u.profile.avatar.url }}" alt="avatar" width="40">
      {% endif %}
    </li>
  {% empty %}
    <li>Нет пользователей.</li>
  {% endfor %}
</ul>
{% endblock %}
