{% extends "admin/base_site.html" %}
{% block content %}
<h1>Импорт заказов из CSV</h1>

    {% csrf_token %}
    {{ form.as_p }}

</form>
<p><a href="{% url 'admin:shopapp_order_changelist' %}">← Назад к списку заказов</a></p>
{% endblock %}
